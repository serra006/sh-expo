name: 每日展会采集

on:
  schedule:
    # GitHub cron 用 UTC。21:23 UTC = 次日 05:23 北京时间。
    # 特意避开整点：GitHub 整点任务排队严重，常延迟 15~60 分钟，我们不需要精确到分钟。
    - cron: '23 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expo-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        # requirements.txt 同时是 setup-python cache: pip 的缓存键，必须存在
        run: pip install -r requirements.txt

      - name: 抓取三个数据源
        run: python fetch.py

      - name: 质量闸门与发布
        # 闸门失败时仍要提交 health.json，所以不中断整个 job
        continue-on-error: true
        id: publish
        run: python publish.py
        env:
          # 不配置这组变量时，publish.py 只写本地 public/，由仓库托管
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: 提交数据文件
        if: always()
        # 即使闸门失败也要提交 health.json，保持仓库活跃：
        # 公开仓库 60 天无活动会自动停用定时任务，这一步同时避免静默断更
        run: |
          git config user.name "expo-bot"
          git config user.email "expo-bot@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: $(date -u +%Y-%m-%d) 采集结果"
            git push
          fi

      - name: 失败告警
        # 让 job 变红，GitHub 会自动发失败邮件（无需额外接邮件服务）
        if: steps.publish.outcome == 'failure'
        run: |
          cat public/health.json
          echo "采集或质量闸门失败，已保留上一版数据"
          exit 1
